title: AeroLLM
description: "Lộ trình thực hành mô hình ngôn ngữ lớn (LLM) bằng tiếng Việt: từ Python, token hoá, tự xây GPT đến huấn luyện, tinh chỉnh và đánh giá."
url: https://aerovfx.github.io
baseurl: /AeroLLM
markdown: kramdown
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
encoding: utf-8
exclude:
  - .git
  - .github
  - .next
  - node_modules
  - skills
  - docs
  - src
  - minGPT
  - nanoGPTsource
  - nanogpt_course
  - public
  - styles/main.css
  - styles/variables.scss
  - fonts
  - icons
  - scripts
  - progress
  - courses
  - package.json
  - package-lock.json
  - tsconfig.json
  - next.config.js
  - next-env.d.ts
  - postcss.config.js
  - tailwind.config.js
  - .gitignore
  - .npmrc
  - requirements.txt
  - reward_functions.py
  - create-font-atlas.jsm
  - create-symbol-font.jsm
  - LICENSE.txt
  - CONTENT_INDEX.md
  - COURSE.md
  - README.md

